<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Find That Card icon">
  <!-- Card outer frame -->
  <rect x="7" y="8" width="34" height="48" rx="6" fill="#6B3F24"></rect>

  <!-- Card border -->
  <rect x="10" y="11" width="28" height="42" rx="4" fill="#3B2A1A"></rect>

  <!-- Card background -->
  <rect x="12" y="13" width="24" height="38" rx="3.5" fill="#1F1A14"></rect>

  <!-- Central oval -->
  <ellipse cx="24" cy="32" rx="10.5" ry="14" fill="#C8A46A"></ellipse>
  <ellipse cx="24" cy="32" rx="8.5" ry="12" fill="#4A3522"></ellipse>

  <!-- Vintage swirl hints -->
  <path d="M18 27c4-3 8-3 12 0" fill="none" stroke="#E7D3A3" stroke-width="1.4" stroke-linecap="round" opacity="0.8"></path>
  <path d="M18 37c4 3 8 3 12 0" fill="none" stroke="#E7D3A3" stroke-width="1.4" stroke-linecap="round" opacity="0.8"></path>

  <!-- Aged pips -->
  <circle cx="24" cy="20" r="1.3" fill="#E7D3A3"></circle>
  <circle cx="24" cy="44" r="1.3" fill="#E7D3A3"></circle>

  <!-- Magnifying glass (antique brass) -->
  <circle cx="44" cy="40" r="10.5" fill="#1A1410"></circle>
  <circle cx="44" cy="40" r="7.5" fill="none" stroke="#B89C6A" stroke-width="3"></circle>

  <!-- Handle -->
  <path d="M50.5 46.5l7 7" stroke="#B89C6A" stroke-width="4" stroke-linecap="round"></path>

  <!-- Subtle lens highlight -->
  <path d="M41.5 37.5c2-2 4-2 6 0" fill="none" stroke="#EFE3C2" stroke-width="1.6" stroke-linecap="round" opacity="0.6"></path>
</svg>
